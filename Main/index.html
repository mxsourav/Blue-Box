<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hizmos Web Serial Panel</title>
    <style>
        body { 
            background-color: #121212; 
            color: #00ff00; 
            font-family: 'Consolas', monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0;
            padding: 20px;
        }
        h1 { color: #fff; margin-bottom: 10px; }
        #terminal { 
            width: 80%; 
            height: 400px; 
            background: #000; 
            color: #0f0; 
            border: 2px solid #333; 
            border-radius: 8px;
            overflow-y: scroll; 
            padding: 10px; 
            margin-bottom: 20px; 
            font-size: 14px;
        }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        button { 
            background-color: #333; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            cursor: pointer; 
            font-family: 'Consolas', monospace; 
            font-size: 16px; 
            border-radius: 5px; 
            transition: 0.2s;
        }
        button:hover { background-color: #555; }
        .dpad { 
            display: grid; 
            grid-template-columns: 80px 80px 80px; 
            grid-gap: 10px; 
            justify-content: center; 
            margin-top: 20px;
        }
        .dpad button { padding: 20px 10px; font-weight: bold; }
        .empty { visibility: hidden; }
        .dpad-center { background-color: #00aa00 !important; }
        .dpad-center:hover { background-color: #00cc00 !important; }
        .dpad-back { background-color: #aa0000 !important; }
        .dpad-back:hover { background-color: #cc0000 !important; }
        
        #controls { width: 80%; display: flex; gap: 10px; justify-content: space-between; }
        input[type="text"] { 
            flex-grow: 1; 
            background: #222; 
            color: #0f0; 
            border: 1px solid #444; 
            border-radius: 5px;
            padding: 10px; 
            font-family: 'Consolas', monospace; 
            font-size: 16px;
        }
        .connect-btn { background-color: #0055a4; margin-bottom: 10px; font-size: 18px; padding: 15px 30px; }
        .connect-btn:hover { background-color: #0077ff; }
    </style>
</head>
<body>
    <h1>Hizmos Web Serial Panel</h1>
    <button class="connect-btn" id="connectBtn">Connect to ESP32 (COM Port)</button>
    
    <div id="terminal"></div>
    
    <div id="controls">
        <input type="text" id="cmdInput" placeholder="Type command here (e.g., start beacon)..." autocomplete="off" />
        <button id="sendBtn">Send</button>
    </div>

    <div class="btn-group" style="margin-top: 20px;">
        <button style="background-color: #0055a4;" onclick="sendCmd('start beacon')">Start Beacon Menu</button>
        <button style="background-color: #0055a4;" onclick="sendCmd('start wifi')">Start WiFi Menu</button>
    </div>

    <div class="dpad">
        <div class="empty"></div>
        <button onmousedown="sendCmd('btn up')" onmouseup="sendCmd('btn release up')">UP</button>
        <div class="empty"></div>

        <button onmousedown="sendCmd('btn left')" onmouseup="sendCmd('btn release left')">LEFT</button>
        <button class="dpad-center" onmousedown="sendCmd('btn select')">SELECT</button>
        <button onmousedown="sendCmd('btn right')" onmouseup="sendCmd('btn release right')">RIGHT</button>

        <div class="empty"></div>
        <button onmousedown="sendCmd('btn down')" onmouseup="sendCmd('btn release down')">DOWN</button>
        <button class="dpad-back" onmousedown="sendCmd('btn back')">BACK</button>
    </div>

    <script>
        let port;
        let outputStream;

        const connectBtn = document.getElementById('connectBtn');
        const terminal = document.getElementById('terminal');
        const cmdInput = document.getElementById('cmdInput');
        const sendBtn = document.getElementById('sendBtn');

        function appendToTerminal(text) {
            // escape html
            const safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            terminal.innerHTML += safeText.replace(/\n/g, '<br>');
            terminal.scrollTop = terminal.scrollHeight;
        }

        connectBtn.addEventListener('click', async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });

                appendToTerminal("[*] Connected successfully to ESP32!\n");
                connectBtn.style.backgroundColor = "#00aa00";
                connectBtn.innerText = "Connected";

                const textEncoder = new TextEncoderStream();
                const writableStreamClosed = textEncoder.readable.pipeTo(port.writable);
                outputStream = textEncoder.writable;

                const textDecoder = new TextDecoderStream();
                const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
                const reader = textDecoder.readable.getReader();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    appendToTerminal(value);
                }
            } catch (err) {
                appendToTerminal("[!] Error: " + err + "\n");
            }
        });

        async function sendCmd(cmd) {
            if (outputStream) {
                appendToTerminal("<span style='color: white;'>>>> " + cmd + "</span>\n");
                const writer = outputStream.getWriter();
                await writer.write(cmd + '\n');
                writer.releaseLock();
            } else {
                alert("Please click 'Connect to ESP32' first!");
            }
        }

        sendBtn.addEventListener('click', () => {
            const cmd = cmdInput.value;
            if (cmd) {
                sendCmd(cmd);
                cmdInput.value = '';
            }
        });

        cmdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendBtn.click();
            }
        });
    </script>
</body>
</html>
